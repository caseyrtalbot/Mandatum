name: Bug report
description: Something behaved wrongly, crashed, or violated a documented guarantee
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or keystrokes, and what you saw vs. expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest sequence that triggers it. The live-slice demo (./examples/live-slice/run.sh) is a good shared starting state.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS version, Apple Silicon or Intel, commit or release version"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Status text, relevant timeline entries, or a captured frame. Redact tokens, secrets, private paths, repository names, sensitive commands, and output before posting. Report security-sensitive evidence privately through SECURITY.md instead.
