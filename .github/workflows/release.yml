name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: full macOS release gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n \
            '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' \
            Cargo.toml)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v${version}"
          printf '%s\n' "$version" | awk -F. '
            NF == 3 &&
            $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {
              valid = 1
            }
            END { exit !valid }
          ' || {
            echo "release version must be a numeric x.y.z triplet: $version" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ./ci/gate.sh

  build:
    name: build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Verify native build host
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "${{ matrix.target }}"
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p mandatum-native --bin mandatum-native
          cargo build --locked --release -p mandatum-agent-runtime --bin mandatum-approval-bridge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/release/mandatum-native
            target/release/mandatum-approval-bridge
          if-no-files-found: error
          retention-days: 7

  package:
    name: package universal Mandatum.app
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-aarch64-apple-darwin
          path: dist/aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-x86_64-apple-darwin
          path: dist/x86_64
      - name: Assemble, sign, and archive the universal app
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/universal
          for binary in mandatum-native mandatum-approval-bridge; do
            lipo -create \
              "dist/aarch64/${binary}" \
              "dist/x86_64/${binary}" \
              -output "dist/universal/${binary}"
            for arch in arm64 x86_64; do
              lipo -archs "dist/universal/${binary}" | grep -qw "$arch"
            done
            chmod 0755 "dist/universal/${binary}"
          done
          ./packaging/package-app.sh \
            --native dist/universal/mandatum-native \
            --bridge dist/universal/mandatum-approval-bridge \
            --version "$version" \
            --output dist
          for arch in arm64 x86_64; do
            lipo -archs dist/Mandatum.app/Contents/MacOS/Mandatum \
              | grep -qw "$arch"
          done
          ditto -c -k --keepParent dist/Mandatum.app dist/Mandatum.app.zip
          (cd dist && shasum -a 256 Mandatum.app.zip >Mandatum.app.zip.sha256)
          (cd dist && shasum -a 256 -c Mandatum.app.zip.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-app
          path: |
            dist/Mandatum.app.zip
            dist/Mandatum.app.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: package
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-app
          path: dist
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c Mandatum.app.zip.sha256)
          ditto -x -k dist/Mandatum.app.zip dist/verify
          test -d dist/verify/Mandatum.app
          test -x dist/verify/Mandatum.app/Contents/MacOS/Mandatum
          codesign --verify --strict dist/verify/Mandatum.app
          packaged_version=$(plutil -extract CFBundleShortVersionString raw -o - \
            dist/verify/Mandatum.app/Contents/Info.plist)
          test "v${packaged_version}" = "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Mandatum.app.zip dist/Mandatum.app.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Mandatum $GITHUB_REF_NAME"

  smoke:
    name: install and update ${{ matrix.target }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            machine: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the published release and exercise mandatum update
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          MANDATUM_APP_DIR: ${{ runner.temp }}/Applications
          MANDATUM_INSTALL_DIR: ${{ runner.temp }}/mandatum-bin
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          expected_version="${GITHUB_REF_NAME#v}"

          sh install.sh
          app="$MANDATUM_APP_DIR/Mandatum.app"
          launcher="$MANDATUM_INSTALL_DIR/mandatum"
          test -x "$app/Contents/MacOS/Mandatum"
          test -x "$launcher"
          codesign --verify --strict "$app"
          test "$(env MANDATUM_APP="$app" "$launcher" --version)" = \
            "mandatum $expected_version"
          test "$("$app/Contents/MacOS/Mandatum" --font-info)" = \
            '{"source":"bundled","requested_family":"JetBrains Mono","size":13.0,"faces":{"regular":"JetBrainsMono-Regular","bold":"JetBrainsMono-Bold","italic":"JetBrainsMono-Italic","bold_italic":"JetBrainsMono-BoldItalic"}}'

          env MANDATUM_APP="$app" "$launcher" update | tee update.out
          grep -q "already the latest release" update.out
          test "$(env MANDATUM_APP="$app" "$launcher" --version)" = \
            "mandatum $expected_version"
