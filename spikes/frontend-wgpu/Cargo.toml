[package]
name = "mandatum-native-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
# The lab harness is the default binary; tui_probe is the external terminal
# latency probe. Product shell and renderer code live in the root workspace.
default-run = "mandatum-native-lab"

[[bin]]
name = "mandatum-native-lab"
path = "src/main.rs"

# The native shell consumes the real shared host. mandatum-pty remains a
# direct dependency only for the standalone tui_probe binary.
[dependencies]
mandatum-app = { path = "../../crates/app" }
mandatum-pty = { path = "../../crates/pty" }
mandatum-scene = { path = "../../crates/scene" }
mandatum-native-renderer = { path = "../../crates/native-renderer", features = ["fault-injection"] }

winit = "0.30"
arboard = "3.6"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = 3
