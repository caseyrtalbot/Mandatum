[workspace]
members = [
  "crates/agent-runtime",
  "crates/app",
  "crates/commands",
  "crates/core",
  "crates/native",
  "crates/native-renderer",
  "crates/pty",
  "crates/renderer",
  "crates/scene",
  "crates/terminal-vt",
  "crates/workflows",
]
default-members = [
  "crates/agent-runtime",
  "crates/app",
  "crates/commands",
  "crates/core",
  "crates/native",
  "crates/native-renderer",
  "crates/pty",
  "crates/renderer",
  "crates/scene",
  "crates/terminal-vt",
  "crates/workflows",
]
# Frontend probes and stress/fault tooling remain outside the workspace.
exclude = ["spikes/frontend-wgpu"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.7.0"

[workspace.dependencies]
crossterm = "0.29"
glyphon = "0.12"
lru = "0.18"
mandatum-agent-runtime = { path = "crates/agent-runtime" }
mandatum-core = { path = "crates/core" }
mandatum-commands = { path = "crates/commands" }
mandatum-native-renderer = { path = "crates/native-renderer" }
mandatum-pty = { path = "crates/pty" }
mandatum-renderer = { path = "crates/renderer" }
mandatum-scene = { path = "crates/scene" }
mandatum-terminal-vt = { path = "crates/terminal-vt" }
mandatum-workflows = { path = "crates/workflows" }
portable-pty = "0.9"
ratatui = "0.30.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sys-locale = "0.3"
ttf-parser = "0.25"
# Script values for the custom cosmic-text Fallback; must stay in sync
# with the unicode-script version cosmic-text itself uses.
unicode-script = "0.5"
png = "0.18"
pollster = "1.0"
# preserve_order keeps config-file key order so "later binding wins"
# means document order, not alphabetical order.
toml = { version = "0.8", features = ["preserve_order"] }
# The appearance overlay writes user config edits; toml_edit (already in
# the tree under toml's serializer) preserves the user's comments and
# formatting where a toml round-trip would discard them.
toml_edit = "0.22"
unicode-segmentation = "1.13"
unicode-width = "0.2"
vte = "0.15"
wgpu = "30"
winit = "0.30"
